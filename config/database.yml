
default: &default
  adapter: postgresql
  encoding: unicode
  pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>
  timeout: 5000

development:
  <<: *default
  database: station1_development

test:
  <<: *default
  database: station1_test

production:
  <<: *default
  # Explicit DB_* vars, not DATABASE_URL (Ruby's URI parser mangles some passwords).
  # Set in config/deploy.yml; the password comes from credentials, decrypted with RAILS_MASTER_KEY.
  host: <%= ENV["DB_HOST"] %>
  port: <%= ENV.fetch("DB_PORT", 5432) %>
  database: <%= ENV["DB_NAME"] %>
  username: <%= ENV["DB_USER"] %>
  password: <%= Rails.application.credentials.dig(:db, :password) %>
